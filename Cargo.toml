[package]
name = "templatry"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Write Once, Use Everywhere! Template & distribute configuration files across repositories."
license = "MIT"

[lib]
name = "templatry"
path = "src/lib.rs"

[[bin]]
name = "templatry"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
flate2 = "1"
glob = "0.3"
hex = "0.4"
json-strip-comments = "3"
miette = { version = "7", features = ["fancy"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
watchexec = "8"
watchexec-signals = "5"
yaml_serde = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
