[package]
name = "templatry"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "Write Once, Use Everywhere! Template & distribute configuration files across repositories."
readme = "README.md"
repository = "https://github.com/Quasiflo/templatry"
license = "Apache-2.0"
keywords = ["cli", "config", "configuration", "template", "terminal"]
categories = ["command-line-utilities", "config"]
exclude = [".config/", ".github/", ".vscode/", "AGENTS.md", "docs/", "scripts/"]

[lib]
name = "templatry"
path = "src/lib.rs"

[[bin]]
name = "templatry"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "7"
flate2 = "1"
glob = "0.3"
hex = "0.4"
json-strip-comments = "3"
miette = { version = "7", features = ["fancy"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "3"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
watchexec = "8"
watchexec-signals = "5"
yaml_serde = "0.10"
zip = { version = "8", default-features = false, features = ["deflate"] }
